name: GitHub Pages 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # 단위 테스트와 빌드가 통과하면 바로 배포한다. 브라우저 테스트는 e2e 작업에서 따로 돌고 배포를 기다리게 하지 않는다.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
          reporting_interval: 10000
  # 배포와 함께 시작한다. 실패하면 이 작업만 실패로 표시되고 이미 배포한 사이트는 그대로다.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
